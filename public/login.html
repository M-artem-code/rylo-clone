<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gornich — вход</title>
  <link rel="stylesheet" href="assets/css/gornich.css">
</head>
<body data-page="login">
  <header class="top">
    <div class="top-inner">
      <a class="brand" href="index.html">GORNICH</a>
      <nav class="nav">
        <a href="client.html" data-i18n="navSearch">Поиск</a>
        <a href="vitrine.html" data-i18n="navVitrine">Витрина</a>
        <a href="login.html" aria-current="page" data-i18n="doorMaid">Я горничная</a>
        <a href="rules.html" data-i18n="navRules">Правила</a>
      </nav>
      <div class="switch" role="group" aria-label="Language">
        <button type="button" data-lang="ru" class="is-on">RU</button>
        <button type="button" data-lang="he">HE</button>
      </div>
    </div>
  </header>
  <main class="wrap center">
    <h1 class="display display-lg" data-i18n="loginTitle">Вход в лавку</h1>
    <p class="lede" data-i18n="loginLede">Только существующий аккаунт. Новое окно открывается регистрацией.</p>
    <form class="panel stack" data-login>
      <div class="field"><label data-i18n="mail">Почта</label><input name="email" type="email" autocomplete="username" required></div>
      <div class="field"><label data-i18n="pass">Пароль</label><input name="password" type="password" autocomplete="current-password" required></div>
      <p class="form-error" data-error hidden></p>
      <button class="cta block" type="submit" data-i18n="enter">Войти</button>
      <a class="ghost-link" href="register.html" data-i18n="create">Нет окна — зарегистрироваться</a>
    </form>
  </main>
  <footer class="foot" data-i18n="gateFoot">Цена часа видна  ·  без торга в чате  ·  заказ = запрос, не подтверждённый визит</footer>
  <script src="assets/js/gornich.js"></script>
</body>
</html>
