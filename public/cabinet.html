<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gornich — кабинет</title>
  <link rel="stylesheet" href="assets/css/gornich.css">
</head>
<body data-page="cabinet">
  <header class="top">
    <div class="top-inner">
      <a class="brand" href="index.html">GORNICH</a>
      <nav class="nav">
        <a href="client.html" data-i18n="navSearch">Поиск</a>
        <a href="vitrine.html" data-i18n="navVitrine">Витрина</a>
        <a href="cabinet.html" aria-current="page" data-i18n="doorMaid">Я горничная</a>
        <a href="rules.html" data-i18n="navRules">Правила</a>
      </nav>
      <div class="switch" role="group" aria-label="Language">
        <button type="button" data-lang="ru" class="is-on">RU</button>
        <button type="button" data-lang="he">HE</button>
      </div>
    </div>
  </header>
  <main class="wrap" data-cabinet>
    <h1 class="display display-lg" data-i18n="cabinetTitle">Ваша лавка</h1>
    <p class="lede" data-i18n="cabinetLede">Открытый приём виден в поиске. Заявки клиентов появляются здесь.</p>
    <p class="empty" data-gate hidden>
      <span data-i18n="needLogin">Сначала войдите в лавку.</span>
      <a class="cta" href="login.html" data-i18n="enter">Войти</a>
    </p>
    <div class="cabinet" data-app hidden>
      <form class="panel stack" data-profile>
        <p class="eyebrow" data-i18n="profile">ПРОФИЛЬ</p>
        <div class="field"><label data-i18n="nameField">Имя на витрине</label><input name="name" required maxlength="60"></div>
        <div class="field"><label data-i18n="hourField">Час, ₪</label><input name="hour" type="number" min="40" max="500" required></div>
        <div class="field">
          <label data-i18n="photo">Фото</label>
          <input name="photo" type="file" accept="image/*">
          <img data-photo-preview alt="" hidden>
        </div>
        <fieldset>
          <legend data-i18n="areas">РАЙОНЫ</legend>
          <div class="checks" data-choices="area"></div>
        </fieldset>
        <fieldset>
          <legend data-i18n="langs">ЯЗЫКИ</legend>
          <div class="checks" data-choices="lang"></div>
        </fieldset>
        <fieldset>
          <legend data-i18n="servicesShelf">УСЛУГИ</legend>
          <div class="checks" data-choices="service"></div>
        </fieldset>
        <fieldset>
          <legend data-i18n="slotsLabel">СЛОТЫ</legend>
          <div class="checks" data-choices="slot"></div>
        </fieldset>
        <p class="form-error" data-error hidden></p>
        <p class="form-ok" data-ok hidden></p>
        <button class="cta" type="submit" data-i18n="saveShop">Сохранить лавку</button>
        <button class="cta" type="button" data-toggle-open data-i18n="openIntake">Открыть приём</button>
        <button class="ghost" type="button" data-logout data-i18n="logout">Выйти</button>
        <p class="muted" data-intake-note></p>
      </form>
      <aside>
        <p class="eyebrow" data-i18n="clientSees">ТАК ВИДИТ КЛИЕНТ</p>
        <div class="preview-card" data-preview></div>
        <p class="eyebrow" data-i18n="inbox">ЗАЯВКИ</p>
        <div class="inbox" data-inbox></div>
      </aside>
    </div>
  </main>
  <footer class="foot" data-i18n="footLive">GORNICH  ·  витрина живёт, когда горничная открывает приём</footer>
  <script src="assets/js/gornich.js"></script>
</body>
</html>
