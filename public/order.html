<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gornich — запрос</title>
  <link rel="stylesheet" href="assets/css/gornich.css">
</head>
<body data-page="order">
  <header class="top">
    <div class="top-inner">
      <a class="brand" href="index.html">GORNICH</a>
      <nav class="nav">
        <a href="client.html" data-i18n="navSearch">Поиск</a>
        <a href="vitrine.html" data-i18n="navVitrine">Витрина</a>
        <a href="login.html" data-i18n="doorMaid">Я горничная</a>
        <a href="rules.html" data-i18n="navRules">Правила</a>
      </nav>
      <div class="switch" role="group" aria-label="Language">
        <button type="button" data-lang="ru" class="is-on">RU</button>
        <button type="button" data-lang="he">HE</button>
      </div>
    </div>
  </header>
  <main class="wrap" data-order>
    <h1 class="display display-lg" data-i18n="orderTitle">Собрать запрос</h1>
    <p class="lede" data-i18n="orderLede">Имя и телефон уйдут горничной вместе со слотом и суммой. Это ещё не оплата.</p>
    <div class="order-grid">
      <img class="hero-shot" alt="" data-photo>
      <div>
        <h2 class="display" data-name></h2>
        <p class="sum" data-hour></p>
        <p class="muted" data-langs></p>
        <p class="muted" data-areas></p>
        <div class="slots" data-slots></div>
        <div class="rows" data-order-math>
          <div class="row"><span data-i18n="rowType">Тип</span><span data-row="type"></span></div>
          <div class="row"><span data-i18n="rowM2">Метраж</span><span data-row="m2"></span></div>
          <div class="row"><span data-i18n="rowHours">Оценка времени</span><span data-row="hours"></span></div>
          <div class="row"><span data-i18n="rowHour">Час горничной</span><span data-row="hour"></span></div>
          <div class="row"><span data-i18n="rowSlot">Слот</span><span data-row="slot"></span></div>
          <div class="row"><span data-i18n="rowSum">Сумма</span><span data-row="sum"></span></div>
        </div>
        <form class="stack" data-order-form>
          <div class="field"><label data-i18n="clientName">Имя</label><input name="clientName" required maxlength="80"></div>
          <div class="field"><label data-i18n="clientPhone">Телефон</label><input name="phone" type="tel" required maxlength="40"></div>
          <div class="field"><label data-i18n="city">Город</label><input name="city" maxlength="80"></div>
          <p class="form-error" data-error hidden></p>
          <button class="cta block" type="submit" data-i18n="order">Отправить запрос</button>
        </form>
        <div class="status" data-status hidden></div>
      </div>
    </div>
  </main>
  <footer class="foot" data-i18n="footLive">GORNICH  ·  витрина живёт, когда горничная открывает приём</footer>
  <script src="assets/js/gornich.js"></script>
</body>
</html>
