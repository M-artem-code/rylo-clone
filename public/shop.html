<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gornich — окно</title>
  <link rel="stylesheet" href="assets/css/gornich.css">
</head>
<body data-page="shop">
  <header class="top">
    <div class="top-inner">
      <a class="brand" href="index.html">GORNICH</a>
      <nav class="nav">
        <a href="client.html" data-i18n="navSearch">Поиск</a>
        <a href="vitrine.html" data-i18n="navVitrine">Витрина</a>
        <a href="login.html" data-i18n="doorMaid">Я горничная</a>
        <a href="rules.html" data-i18n="navRules">Правила</a>
      </nav>
      <div class="switch" role="group" aria-label="Language">
        <button type="button" data-lang="ru" class="is-on">RU</button>
        <button type="button" data-lang="he">HE</button>
      </div>
    </div>
  </header>
  <main class="wrap">
    <p class="kicker" data-crumb data-i18n="shopCrumb">Окно</p>
    <div class="shop" data-shop>
      <img class="hero-shot" alt="" data-photo>
      <div class="shop-copy">
        <h1 class="display" data-name></h1>
        <p class="muted" data-langs></p>
        <p class="muted" data-areas></p>
        <p class="sum" data-hour></p>
        <p class="eyebrow" data-i18n="shopServices">УСЛУГИ</p>
        <div class="chips" data-service-row></div>
        <p class="eyebrow" data-i18n="rowSlot">Слот</p>
        <div class="slots" data-slots></div>
        <div class="estimate" data-order-math>
          <p class="eyebrow" data-i18n="visitBuild">СБОР ВИЗИТА</p>
          <p data-visit-line></p>
          <p class="sum" data-sum-line></p>
          <p class="muted" data-i18n="sumBefore">Сумма до заявки. В чате цена не переписывается.</p>
        </div>
        <a class="cta block" href="order.html" data-to-order data-i18n="chooseOrder">Выбрать и заказать</a>
      </div>
    </div>
    <section>
      <p class="eyebrow" data-i18n="reviews">ОТЗЫВЫ</p>
      <p class="lede" data-i18n="reviewsNote">Текста нет, пока не было визита. Рейтинга и бейджа «проверена» здесь нет.</p>
    </section>
  </main>
  <footer class="foot" data-i18n="footLive">GORNICH  ·  витрина живёт, когда горничная открывает приём</footer>
  <script src="assets/js/gornich.js"></script>
</body>
</html>
