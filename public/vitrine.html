<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gornich — витрина</title>
  <link rel="stylesheet" href="assets/css/gornich.css">
</head>
<body data-page="vitrine">
  <header class="top">
    <div class="top-inner">
      <a class="brand" href="index.html">GORNICH</a>
      <nav class="nav">
        <a href="client.html" data-i18n="navSearch">Поиск</a>
        <a href="vitrine.html" aria-current="page" data-i18n="navVitrine">Витрина</a>
        <a href="login.html" data-i18n="doorMaid">Я горничная</a>
        <a href="rules.html" data-i18n="navRules">Правила</a>
      </nav>
      <div class="switch" role="group" aria-label="Language">
        <button type="button" data-lang="ru" class="is-on">RU</button>
        <button type="button" data-lang="he">HE</button>
      </div>
    </div>
  </header>
  <main class="wrap" data-market>
    <div class="query">
      <p class="query-line" data-query-line></p>
      <span class="muted" data-count></span>
    </div>
    <div class="market">
      <aside class="filters">
        <div class="field">
          <label data-i18n="type">Тип</label>
          <select name="type">
            <option value="" data-i18n="anyType">Любой тип</option>
            <option>Стандарт</option>
            <option>Генеральная</option>
            <option>После ремонта</option>
            <option>Окна</option>
            <option>Глажка</option>
          </select>
        </div>
        <p class="eyebrow" data-i18n="areas">РАЙОНЫ</p>
        <ul class="filter-list">
          <li><label><input type="checkbox" name="area" value="Тель-Авив"> Тель-Авив</label></li>
          <li><label><input type="checkbox" name="area" value="Яффо"> Яффо</label></li>
          <li><label><input type="checkbox" name="area" value="Рамат-Ган"> Рамат-Ган</label></li>
          <li><label><input type="checkbox" name="area" value="Холон"> Холон</label></li>
          <li><label><input type="checkbox" name="area" value="Хайфа"> Хайфа</label></li>
          <li><label><input type="checkbox" name="area" value="Петах-Тиква"> Петах-Тиква</label></li>
        </ul>
        <p class="eyebrow" data-i18n="langs">ЯЗЫКИ</p>
        <ul class="filter-list">
          <li><label><input type="checkbox" name="lang" value="русский"> русский</label></li>
          <li><label><input type="checkbox" name="lang" value="иврит"> иврит</label></li>
          <li><label><input type="checkbox" name="lang" value="English"> English</label></li>
        </ul>
      </aside>
      <div>
        <div class="windows tight" data-results></div>
        <p class="empty" data-empty hidden data-i18n="emptyWindows">В этом срезе окон нет.</p>
      </div>
    </div>
  </main>
  <footer class="foot" data-i18n="footLive">GORNICH  ·  витрина живёт, когда горничная открывает приём</footer>
  <script src="assets/js/gornich.js"></script>
</body>
</html>
