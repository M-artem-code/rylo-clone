<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gornich — регистрация</title>
  <link rel="stylesheet" href="assets/css/gornich.css">
</head>
<body data-page="register">
  <header class="top">
    <div class="top-inner">
      <a class="brand" href="index.html">GORNICH</a>
      <nav class="nav">
        <a href="client.html" data-i18n="navSearch">Поиск</a>
        <a href="vitrine.html" data-i18n="navVitrine">Витрина</a>
        <a href="register.html" aria-current="page" data-i18n="doorMaid">Я горничная</a>
        <a href="rules.html" data-i18n="navRules">Правила</a>
      </nav>
      <div class="switch" role="group" aria-label="Language">
        <button type="button" data-lang="ru" class="is-on">RU</button>
        <button type="button" data-lang="he">HE</button>
      </div>
    </div>
  </header>
  <main class="wrap center">
    <h1 class="display display-lg" data-i18n="registerTitle">Открыть свою лавку</h1>
    <p class="lede" data-i18n="registerLede">После регистрации окно сразу появляется у клиентов. Их заявки придут в кабинет.</p>
    <form class="panel stack" data-register>
      <div class="field"><label data-i18n="mail">Почта</label><input name="email" type="email" autocomplete="username" required></div>
      <div class="field"><label data-i18n="pass">Пароль</label><input name="password" type="password" minlength="6" autocomplete="new-password" required></div>
      <div class="field"><label data-i18n="nameField">Имя на витрине</label><input name="name" required maxlength="60"></div>
      <div class="field"><label data-i18n="hourField">Час, ₪</label><input name="hour" type="number" min="40" max="500" value="90" required></div>
      <div class="field">
        <label data-i18n="photo">Фото</label>
        <input name="photo" type="file" accept="image/*">
        <img data-photo-preview alt="" hidden>
      </div>
      <fieldset>
        <legend data-i18n="areas">РАЙОНЫ</legend>
        <div class="checks" data-choices="area"></div>
      </fieldset>
      <fieldset>
        <legend data-i18n="langs">ЯЗЫКИ</legend>
        <div class="checks" data-choices="lang"></div>
      </fieldset>
      <fieldset>
        <legend data-i18n="servicesShelf">УСЛУГИ</legend>
        <div class="checks" data-choices="service"></div>
      </fieldset>
      <fieldset>
        <legend data-i18n="slotsLabel">СЛОТЫ</legend>
        <div class="checks" data-choices="slot"></div>
      </fieldset>
      <p class="form-error" data-error hidden></p>
      <button class="cta block" type="submit" data-i18n="registerSubmit">Зарегистрироваться</button>
      <a class="ghost-link" href="login.html" data-i18n="haveAccount">Уже есть лавка — войти</a>
    </form>
  </main>
  <footer class="foot" data-i18n="footLive">GORNICH  ·  витрина живёт, когда горничная открывает приём</footer>
  <script src="assets/js/gornich.js"></script>
</body>
</html>
